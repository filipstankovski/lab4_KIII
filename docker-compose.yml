services:
  docker:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    networks:
      - jenkins

  jenkins:
    image: jenkins/jenkins:lts
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      DOCKER_HOST: tcp://docker:2375
    volumes:
      - jenkins-data:/var/jenkins_home
    depends_on:
      - docker
    networks:
      - jenkins

networks:
  jenkins:

volumes:
  jenkins-data:
